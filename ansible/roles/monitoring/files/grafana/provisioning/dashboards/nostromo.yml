apiVersion: 1

# Dashboards versionnés dans le repo : modifiables dans l'UI pour tester, mais écrasés au prochain déploiement
providers:
  - name: nostromo
    folder: Nostromo
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
